<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0B">
  <meta name="description" content="Offline-first community health screening and Zakat Preservation Ledger.">
  <title>Sehat Ledger</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
  <link rel="preload" href="fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
  <div class="backdrop"></div>

  <svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
    <symbol id="icon-screen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 12h14M12 5l7 7-7 7"/>
    </symbol>
    <symbol id="icon-records" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect width="18" height="18" x="3" y="3" rx="2"/>
      <path d="M7 8h10M7 12h10M7 16h10"/>
    </symbol>
    <symbol id="icon-followup" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </symbol>
    <symbol id="icon-ledger" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" x2="12" y1="2" y2="22"/>
      <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
    </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </symbol>
    <symbol id="icon-camera" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/>
      <circle cx="12" cy="13" r="3"/>
    </symbol>
    <symbol id="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </symbol>
  </svg>

  <div id="statusbar" class="statusbar" role="status" aria-live="polite" hidden></div>

  <div class="app">
    <aside class="sidebar">
      <div class="logo-container">
        <div class="avatar" style="font-size: 20px; width: 40px; height: 40px;">SL</div>
        <div class="logo-info">
          <span class="logo-text">Sehat Ledger</span>
          <span class="logo-subtext">ABF Foundation</span>
        </div>
      </div>
      <nav class="nav-list" aria-label="Desktop navigation">
        <a class="tab nav-item" data-tab="/" href="#/">
          <svg><use href="#icon-screen"></use></svg>
          Screening
        </a>
        <a class="tab nav-item" data-tab="/records" href="#/records">
          <svg><use href="#icon-records"></use></svg>
          Records
        </a>
        <a class="tab nav-item" data-tab="/followups" href="#/followups">
          <svg><use href="#icon-followup"></use></svg>
          Follow-up
          <span id="followup-badge-sidebar" class="tab__badge" style="position:relative; top:0; right:0; margin-left:8px;" hidden></span>
        </a>
        <a class="tab nav-item" data-tab="/ledger" href="#/ledger">
          <svg><use href="#icon-ledger"></use></svg>
          Ledger
        </a>
        <a class="tab nav-item" data-tab="/settings" href="#/settings">
          <svg><use href="#icon-settings"></use></svg>
          Settings
        </a>
      </nav>
      <div class="profile-block">
        <div class="avatar" id="sidebar-avatar">AB</div>
        <div class="user-info">
          <span class="user-name" id="sidebar-user">Volunteer</span>
          <span class="user-role">Mosque Camp</span>
        </div>
      </div>
    </aside>

    <div class="top-header">
      <button id="back" class="appbar__back" type="button" aria-label="Back" hidden>&#8592;</button>
      <div class="top-logo">
        <div class="avatar" style="width: 28px; height: 28px; font-size: 11px;">SL</div>
        <span class="top-logo-text" id="title">Sehat Ledger</span>
      </div>
      <div class="avatar" id="top-avatar" style="width: 32px; height: 32px;">AB</div>
    </div>

    <!-- Main Content Area where app.js renders its views -->
    <main class="content" id="app" tabindex="-1">
      <p class="loading">Loading&hellip;</p>
    </main>

    <nav class="mobile-tabbar" aria-label="Mobile navigation">
      <a class="tab mobile-tab-item" data-tab="/" href="#/">
        <svg><use href="#icon-screen"></use></svg>
        Screen
      </a>
      <a class="tab mobile-tab-item" data-tab="/records" href="#/records">
        <svg><use href="#icon-records"></use></svg>
        Records
      </a>
      <a class="tab mobile-tab-item" data-tab="/followups" href="#/followups">
        <svg><use href="#icon-followup"></use></svg>
        Follow-up
        <span id="followup-badge" class="tab__badge" hidden></span>
      </a>
      <a class="tab mobile-tab-item" data-tab="/ledger" href="#/ledger">
        <svg><use href="#icon-ledger"></use></svg>
        Ledger
      </a>
      <a class="tab mobile-tab-item" data-tab="/settings" href="#/settings">
        <svg><use href="#icon-settings"></use></svg>
        Setup
      </a>
    </nav>
  </div>

  <div class="toast-container" id="toast-container"></div>
  <div class="sheet-backdrop" id="sheet-root" style="display: none;"></div>

  <!-- Camera capture container -->
  <div id="camera" class="camera" hidden>
    <video id="camera-video" class="camera__video" playsinline muted></video>
    <div class="camera__frame" aria-hidden="true"></div>
    <p class="camera__hint">Fill the box with the device screen, then hold still.</p>
    <div class="camera__actions">
      <button id="camera-cancel" class="btn btn--ghost" type="button">Cancel</button>
      <button id="camera-shoot" class="btn btn--primary btn--round" type="button">Capture</button>
    </div>
    <canvas id="camera-canvas" hidden></canvas>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
